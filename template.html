/* A title card around the window; the room remains the first image. */
.viewport{container-type:inline-size}
#game:has(#title-page:not([hidden])){width:min(1320px,100%,calc((100svh - 74px)*1.53846))}
#game:has(#title-page:not([hidden])) .playing{padding-right:0}
#game:has(#title-page:not([hidden])) .inventory,
#game:has(#title-page:not([hidden])) .bottomline{display:none}
#game:has(#title-page:not([hidden])) .top-tools,
#game:has(#title-page:not([hidden])) #controls,
#game:has(#title-page:not([hidden])) .arrow,
#game:has(#title-page:not([hidden])) .subtitle-wrap{visibility:hidden}
#game:has(#title-page:not([hidden])) .topline .brand{opacity:.55;letter-spacing:5px}
.title-page{position:absolute;inset:0;z-index:25;display:block;isolation:isolate;background:linear-gradient(90deg,#0d1b1410 0%,#14201818 34%,#111a13a3 57%,#0c1512ee 100%)}
.title-page:before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,#0b17182e,transparent 27%,transparent 72%,#0b151788)}
.title-page:after{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;box-shadow:inset 0 0 65px #0c17134a}
/* Heavy Ming display lettering, shared by opening and chapter-scale headings. */
.viewport h1,.viewport h2{font-family:'Window Rain Display','Noto Serif TC','Songti TC',serif;font-weight:900;font-style:normal;font-synthesis:none;letter-spacing:-.045em;line-height:1.2}
.menu-content h2,.ending-page h2{font-size:clamp(24px,4.3cqw,52px);letter-spacing:-.04em;transform:skewX(-4deg);color:#f5f3e9;padding:.1em .12em;overflow:visible}
.paper-panel h2{font-family:'Window Rain Display','Noto Serif TC','Songti TC',serif;font-weight:900;font-size:clamp(20px,3.2cqw,34px);letter-spacing:-.04em;line-height:1.3;transform:skewX(-3deg)}
.film-title{position:absolute;right:6%;top:49%;width:36%;transform:translateY(-50%);text-align:center;color:#f6f4eb}
.title-page h1{font-family:'Window Rain Display','Noto Serif TC','Songti TC',serif;font-size:clamp(44px,8.55cqw,110px);font-weight:900;font-style:normal;font-synthesis:none;line-height:1.22;letter-spacing:-.065em;white-space:nowrap;width:max-content;max-width:100%;margin:0 auto;padding:0 .07em .05em;overflow:visible;transform:skewX(-5deg);text-shadow:0 2px 14px #0a151433}
.title-page .en{font-family:'Window Rain Condensed','Arial Narrow',sans-serif;font-style:normal;font-weight:300;font-synthesis:none;font-size:clamp(16px,2.55cqw,32px);line-height:1.2;letter-spacing:.035em;white-space:nowrap;margin:0 0 .12em;color:#f5f3e9}
.title-actions{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:0 24px;margin-top:clamp(20px,3.8cqw,45px)}
.title-page .title-actions button{display:inline-flex;align-items:center;gap:10px;justify-content:center;min-height:44px;font-size:clamp(12px,1.15cqw,15px);font-family:'PingFang TC','Microsoft JhengHei',sans-serif;font-weight:400;letter-spacing:.2em;line-height:1.5;margin:0;padding:0 2px 4px;border-bottom:1px solid #b9ad7b70;color:#e2d6b8;transition:color .2s,border-color .2s}
.title-page .title-actions button:hover{color:#fff0d0;border-color:#e6ce91}
.title-page .title-actions button:focus-visible{outline:1px solid #e6ce91;outline-offset:7px}
.title-page .title-actions button span{font-size:16px;letter-spacing:0;opacity:.7}
.title-page #continue{color:#c9c8b5;border-color:#b4b7a753}
/* Local lamp pools: never pulse or brighten the entire scene. */
.room-light{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;overflow:hidden;mix-blend-mode:screen;transition:opacity .6s ease;--lamp-x:25%;--lamp-y:45%;--lamp-w:27%;--lamp-h:42%;--ceiling-x:54%;--ceiling-y:14%}
.room-light .lamp-pool{position:absolute;left:var(--lamp-x);top:var(--lamp-y);width:var(--lamp-w);height:var(--lamp-h);transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse,#f5c57436 0%,#ddb16c18 31%,#bfa67707 58%,transparent 75%);opacity:.58;animation:lampsway 8.8s ease-in-out infinite alternate;animation-play-state:paused;transform-origin:50% 13%}
.room-light .ceiling-pool{position:absolute;left:var(--ceiling-x);top:var(--ceiling-y);width:27%;height:39%;transform:translate(-50%,-15%);border-radius:50%;background:radial-gradient(ellipse at 50% 0%,#edc27a19,transparent 70%);opacity:.5;animation:ceilingdrift 11s ease-in-out infinite alternate;animation-play-state:paused}
.viewport[data-room="sewing"] .room-light{--lamp-x:85%;--lamp-y:45%;--lamp-w:29%;--lamp-h:44%;--ceiling-x:51.5%;--ceiling-y:14%}
.viewport[data-room="radio"] .room-light{--lamp-x:24%;--lamp-y:47%;--lamp-w:29%;--lamp-h:42%;--ceiling-x:50%;--ceiling-y:14%}
.viewport[data-room="roof"] .room-light{display:none}
.viewport.room-view[data-active="true"] .room-light,
.viewport[data-view="room"][data-active="true"] .room-light{opacity:1}
.viewport.room-view[data-active="true"] .room-light>span,
.viewport[data-view="room"][data-active="true"] .room-light>span{animation-play-state:running}
@keyframes lampsway{from{transform:translate(-53%,-50%) rotate(-3deg);opacity:.48}to{transform:translate(-47%,-49.5%) rotate(3deg);opacity:.64}}
@keyframes ceilingdrift{from{transform:translate(-50.4%,-15%) rotate(-.5deg);opacity:.38}to{transform:translate(-49.6%,-15%) rotate(.5deg);opacity:.5}}
@media(max-width:720px){
  #game:has(#title-page:not([hidden])){width:100%}
  .title-page{background:linear-gradient(90deg,#0f1c142b 0%,#111e1840 34%,#101a14c7 60%,#0d1714ee 100%)}
  .film-title{right:4%;width:43%;top:49%}
  .title-page h1{font-size:clamp(29px,9.75cqw,65px);letter-spacing:-.065em;line-height:1.22}
  .title-page .en{font-size:clamp(14px,3.15cqw,23px);margin:0 0 .12em;letter-spacing:.035em}
  .title-actions{gap:0 15px;margin-top:14px;flex-wrap:nowrap}
  .title-page .title-actions button{font-size:11px;letter-spacing:.12em;min-height:40px;gap:5px;white-space:nowrap;padding-bottom:2px}
  .title-page .title-actions button span{font-size:12px}
}
@media(max-width:400px){
  .film-title{right:4%;width:44%}
  .title-page h1{font-size:clamp(27px,10cqw,38px)}
  .title-page .en{font-size:14px;margin:0 0 .12em}
  .title-actions{margin-top:8px;gap:0 12px}
  .title-page .title-actions button{min-height:38px;font-size:10px;letter-spacing:.08em}
}
@media(max-height:500px) and (orientation:landscape){
  #shell:has(#title-page:not([hidden])){padding:6px 18px}
  #game:has(#title-page:not([hidden])){width:min(100%,calc((100svh - 46px)*1.53846))}
  #game:has(#title-page:not([hidden])) .topline{height:25px}
  .title-page h1{font-size:9.25cqw}
  .title-actions{margin-top:2.4cqw}
}
@media(prefers-reduced-motion:reduce){
  .room-light,.room-light>span,.title-page button{animation:none!important;transition:none!important}
  .room-light .lamp-pool{opacity:.5}
}
